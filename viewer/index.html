<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="簿記1級道場" />
  <meta name="theme-color" content="#F7F6F2" />
  <title>日商簿記 3級→1級 貫通カリキュラム学習スタジオ</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Optional progressive enhancement for LaTeX math & Mermaid diagrams when online -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <button id="mobileMenuBtn" class="icon-btn mobile-only" type="button" title="目次と検索を開く" aria-label="目次と検索を開く" aria-controls="sidebar" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <line x1="2.5" y1="5.5" x2="15.5" y2="5.5" />
          <line x1="2.5" y1="9.5" x2="15.5" y2="9.5" />
          <line x1="2.5" y1="13.5" x2="11.5" y2="13.5" />
        </svg>
      </button>
      <div class="brand">
        <h1 class="brand-title">日商簿記 <span class="brand-sub">3→1級</span></h1>
        <span class="brand-badge">2027</span>
        <span id="mobileContextLabel" class="mobile-context-label mobile-only"></span>
      </div>
    </div>

    <div class="header-center">
      <div class="studio-mode-group" role="tablist" aria-label="学習モード切替">
        <button id="modeReaderBtn" class="tool-btn mode-btn active" type="button" role="tab" aria-selected="true" data-studio-mode="reader" title="教材テキストを読む">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 3.25h4a1.5 1.5 0 0 1 1.5 1.5v8.5a1.25 1.25 0 0 0-1.25-1.25h-4.25z" />
            <path d="M13.5 3.25h-4a1.5 1.5 0 0 0-1.5 1.5v8.5a1.25 1.25 0 0 1 1.25-1.25h4.25z" />
          </svg>
          <span class="btn-label">教材</span>
        </button>
        <button id="modeDrillBtn" class="tool-btn mode-btn" type="button" role="tab" aria-selected="false" data-studio-mode="drill" title="入力自動採点＆フラッシュカード仕訳道場">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11.75 2.25l2 2-7.5 7.5-2.75.75.75-2.75z" />
            <line x1="9.75" y1="4.25" x2="11.75" y2="6.25" />
          </svg>
          <span class="btn-label">道場</span>
        </button>
        <button id="modeSimBtn" class="tool-btn mode-btn" type="button" role="tab" aria-selected="false" data-studio-mode="sim" title="シュラッター図・CVP・新リース・NPV・定率法シミュレータ">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="2.5" y1="4.5" x2="13.5" y2="4.5" />
            <line x1="2.5" y1="8" x2="13.5" y2="8" />
            <line x1="2.5" y1="11.5" x2="13.5" y2="11.5" />
            <circle cx="6" cy="4.5" r="1.4" fill="var(--surface)" />
            <circle cx="10.5" cy="8" r="1.4" fill="var(--surface)" />
            <circle cx="5" cy="11.5" r="1.4" fill="var(--surface)" />
          </svg>
          <span class="btn-label">試算</span>
        </button>
        <button id="modeAnalyticsBtn" class="tool-btn mode-btn" type="button" role="tab" aria-selected="false" data-studio-mode="analytics" title="級別/ライン別進捗と分散復習リマインダー">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="2.5" y1="13" x2="13.5" y2="13" />
            <line x1="4.5" y1="10.5" x2="4.5" y2="8" />
            <line x1="8" y1="10.5" x2="8" y2="4.5" />
            <line x1="11.5" y1="10.5" x2="11.5" y2="6.5" />
          </svg>
          <span class="btn-label">分析</span>
        </button>
        <button id="modeCheatBtn" class="tool-btn mode-btn" type="button" role="tab" aria-selected="false" data-studio-mode="cheat" title="Part VII 本質チートシート＆赤シート暗記モード">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="2.5" width="10" height="11" rx="1.5" />
            <line x1="5.5" y1="6" x2="10.5" y2="6" />
            <line x1="5.5" y1="8.75" x2="10.5" y2="8.75" />
            <line x1="5.5" y1="11.25" x2="8.5" y2="11.25" />
          </svg>
          <span class="btn-label">暗記</span>
        </button>
      </div>
    </div>

    <div class="header-actions">
      <div class="progress-summary" title="公開済み単元のマスター進捗">
        <div class="progress-labels">
          <span id="masteredCountLabel">習得 0 / 0</span>
          <span id="publishedCountLabel">公開 0 / 0単元</span>
        </div>
        <div class="progress-track">
          <div id="masteredBar" class="progress-fill"></div>
        </div>
      </div>

      <button id="mobileTocBtn" class="icon-btn mobile-toc-trigger" type="button" title="この単元のセクション目次" aria-label="セクション目次を開く" aria-controls="mobileTocSheet" aria-expanded="false">
        <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="4.5" x2="15" y2="4.5" />
          <line x1="6" y1="9" x2="15" y2="9" />
          <line x1="6" y1="13.5" x2="13" y2="13.5" />
          <circle cx="3" cy="4.5" r="0.8" fill="currentColor" stroke="none" />
          <circle cx="3" cy="9" r="0.8" fill="currentColor" stroke="none" />
          <circle cx="3" cy="13.5" r="0.8" fill="currentColor" stroke="none" />
        </svg>
      </button>

      <div class="tools-menu-wrap">
        <button id="toolsMenuBtn" class="tool-btn" type="button" aria-expanded="false" aria-controls="toolsMenu" title="学習ツールとデータ管理">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" />
            <rect x="9" y="2.5" width="4.5" height="4.5" rx="1" />
            <rect x="2.5" y="9" width="4.5" height="4.5" rx="1" />
            <rect x="9" y="9" width="4.5" height="4.5" rx="1" />
          </svg>
          <span class="btn-label">ツール</span>
        </button>

        <div id="toolsMenu" class="tools-popover hidden" role="dialog" aria-label="学習ツールメニュー">
          <div class="sheet-handle mobile-only" aria-hidden="true"></div>
          <div class="tools-menu-section-label">学習補助</div>
          <button id="focusCoreBtn" class="tools-menu-item" type="button" title="セクション3の未来フックを折りたたみ、今級コアに集中します">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <circle cx="8" cy="8" r="5.5" />
              <circle cx="8" cy="8" r="2" />
            </svg>
            <span class="tools-item-label">今級集中モード</span>
            <span class="tools-item-state"></span>
          </button>
          <button id="timerToggleBtn" class="tools-menu-item" type="button" title="演習タイマーを開く">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
              <circle cx="8" cy="8.75" r="5.25" />
              <polyline points="8 6 8 8.75 10 10" />
              <line x1="6.25" y1="2" x2="9.75" y2="2" />
            </svg>
            <span class="tools-item-label">演習タイマー</span>
          </button>
          <button id="scratchToggleBtn" class="tools-menu-item" type="button" title="1級仕様下書きパッド＆電卓を開く">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="2" width="10" height="12" rx="1.5" />
              <line x1="5.25" y1="5" x2="10.75" y2="5" />
              <line x1="5.5" y1="8.25" x2="6.5" y2="8.25" />
              <line x1="9.5" y1="8.25" x2="10.5" y2="8.25" />
              <line x1="5.5" y1="11" x2="6.5" y2="11" />
              <line x1="9.5" y1="11" x2="10.5" y2="11" />
            </svg>
            <span class="tools-item-label">下書きパッド・電卓</span>
          </button>
          <a id="fullPdfLink" class="tools-menu-item pdf-link-btn hidden" href="../dist/pdf/boki-1kyu-curriculum.pdf" target="_blank" rel="noopener noreferrer" title="Typst製 完全合本PDFを開く">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 2.25h5.5l3 3v8.5H4z" />
              <polyline points="9.5 2.25 9.5 5.25 12.5 5.25" />
            </svg>
            <span class="tools-item-label">完全合本 PDF</span>
          </a>

          <div class="tools-menu-divider"></div>
          <div class="tools-menu-section-label">同期・バックアップ</div>
          <button id="syncCodeBtn" class="tools-menu-item" type="button" title="PC⇔iPhone 進捗ワンタップ同期コード">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 6.5A5.25 5.25 0 0 0 3.75 4.75" />
              <polyline points="3.5 2.5 3.5 5 6 5" />
              <path d="M3 9.5a5.25 5.25 0 0 0 9.25 1.75" />
              <polyline points="12.5 13.5 12.5 11 10 11" />
            </svg>
            <span class="tools-item-label">PC・iPhone 同期コード</span>
          </button>
          <button id="exportStateBtn" class="tools-menu-item" type="button" title="学習記録をJSONで書き出す">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="8" y1="2.5" x2="8" y2="10.25" />
              <polyline points="5 7.5 8 10.5 11 7.5" />
              <path d="M3 12.5v1h10v-1" />
            </svg>
            <span class="tools-item-label">記録を書き出す (JSON)</span>
          </button>
          <label class="tools-menu-item import-label" title="学習記録JSONを読み込む">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="8" y1="10.5" x2="8" y2="2.75" />
              <polyline points="5 5.5 8 2.5 11 5.5" />
              <path d="M3 12.5v1h10v-1" />
            </svg>
            <span class="tools-item-label">記録を読み込む (JSON)</span>
            <input id="importStateInput" type="file" accept="application/json" hidden />
          </label>
        </div>
      </div>

      <button id="themeToggle" class="icon-btn" type="button" title="ライト／ダークテーマ切替" aria-label="テーマ切替"></button>
    </div>
    <div id="readingProgressBar" class="reading-progress-bar" aria-hidden="true"></div>
  </header>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="カリキュラム目次">
      <div class="sidebar-mobile-head mobile-only">
        <span class="sidebar-mobile-title">目次・単元検索</span>
        <button id="sidebarCloseBtn" class="icon-btn" type="button" aria-label="目次を閉じる">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <line x1="3.5" y1="3.5" x2="12.5" y2="12.5" />
            <line x1="12.5" y1="3.5" x2="3.5" y2="12.5" />
          </svg>
        </button>
      </div>
      <div class="sidebar-controls">
        <div class="search-box">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" />
            <line x1="10.5" y1="10.5" x2="13.75" y2="13.75" />
          </svg>
          <input id="searchInput" type="search" placeholder="単元名・ID・キーワード検索..." autocomplete="off" aria-label="単元名・ID・理論キーワードで検索" />
        </div>
        <div class="tab-group" role="tablist" aria-label="目次表示切替">
          <button id="tabByPart" class="tab-btn active" type="button" role="tab" aria-selected="true" data-mode="part">級別 (Part I–VII)</button>
          <button id="tabByLine" class="tab-btn" type="button" role="tab" aria-selected="false" data-mode="line">貫通ライン別</button>
        </div>
        <label class="filter-toggle">
          <input id="onlyAvailableChk" type="checkbox" />
          <span>公開済みのみ表示</span>
        </label>
      </div>
      <nav id="sidebarNav" class="sidebar-nav" aria-label="カリキュラム単元一覧"></nav>
    </aside>

    <main id="mainContent" class="main-content" tabindex="-1">
      <div id="readerView" class="studio-view">
        <div id="docToolbar" class="doc-toolbar">
          <div id="docMetaBadges" class="doc-meta-badges"></div>
          <div class="doc-toolbar-right">
            <a id="unitPdfLink" class="tool-btn pdf-link-btn hidden" href="#" target="_blank" rel="noopener noreferrer" title="この単元のTypst PDFを開く">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 2.25h5.5l3 3v8.5H4z" />
                <polyline points="9.5 2.25 9.5 5.25 12.5 5.25" />
              </svg>
              <span>単元 PDF</span>
            </a>
            <div id="reviewTracker" class="review-tracker" title="分散学習・復習完了日を記録">
              <span class="tracker-label">復習記録</span>
              <button class="day-btn" type="button" data-day="day0">Day 0</button>
              <button class="day-btn" type="button" data-day="day1">Day 1</button>
              <button class="day-btn" type="button" data-day="day7">Day 7</button>
              <button class="day-btn" type="button" data-day="day21">Day 21</button>
            </div>
          </div>
        </div>

        <article id="articleBody" class="article-body"></article>

        <footer class="doc-footer-nav">
          <button id="prevDocBtn" class="nav-pill" type="button" disabled>← 前の単元</button>
          <button id="nextDocBtn" class="nav-pill" type="button" disabled>次の単元 →</button>
        </footer>
      </div>

      <section id="drillView" class="studio-view hidden" aria-label="仕訳道場"></section>
      <section id="simView" class="studio-view hidden" aria-label="会計・原価シミュレータ"></section>
      <section id="analyticsView" class="studio-view hidden" aria-label="学習アナリティクス"></section>
      <section id="cheatView" class="studio-view hidden" aria-label="本質チートシート＆暗記シート"></section>
    </main>

    <aside class="toc-sidebar" aria-label="ページ内目次">
      <div class="toc-sticky">
        <div class="toc-title">このページの構成</div>
        <nav id="tocNav" class="toc-nav" aria-label="セクション見出し"></nav>
      </div>
    </aside>
  </div>

  <div id="sidebarBackdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>

  <section id="mobileTocSheet" class="mobile-toc-sheet hidden" role="dialog" aria-label="このページの構成">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="panel-header">
      <span id="mobileTocTitle">このページの構成</span>
      <button class="panel-close" type="button" data-close="mobileTocSheet" aria-label="セクション目次を閉じる">✕</button>
    </div>
    <nav id="mobileTocNav" class="mobile-toc-nav" aria-label="モバイルセクション目次"></nav>
  </section>

  <!-- Exercise Timer Floating Panel -->
  <section id="timerPanel" class="floating-panel hidden" aria-label="演習タイマー">
    <div class="panel-header">
      <span>演習タイマー</span>
      <button class="panel-close" type="button" data-close="timerPanel" aria-label="タイマーを閉じる">✕</button>
    </div>
    <div class="panel-body">
      <div id="timerDisplay" class="timer-display">25:00</div>
      <div class="timer-presets">
        <button class="preset-btn" type="button" data-mins="20">20分</button>
        <button class="preset-btn" type="button" data-mins="30">30分</button>
        <button class="preset-btn" type="button" data-mins="35">35分</button>
        <button class="preset-btn" type="button" data-mins="60">60分</button>
        <button class="preset-btn" type="button" data-mins="0">計測</button>
      </div>
      <div class="timer-controls">
        <button id="timerStartBtn" class="primary-btn" type="button">開始</button>
        <button id="timerPauseBtn" class="secondary-btn" type="button">停止</button>
        <button id="timerResetBtn" class="secondary-btn" type="button">リセット</button>
      </div>
    </div>
  </section>

  <!-- 1-Kyu Drafting Scratchpad & Safe Calculator Panel -->
  <section id="scratchPanel" class="floating-panel wide-panel hidden" aria-label="下書きスクラッチパッドと電卓">
    <div class="panel-header">
      <span>1級仕様 下書きパッド＆電卓</span>
      <button class="panel-close" type="button" data-close="scratchPanel" aria-label="下書きパッドを閉じる">✕</button>
    </div>
    <div class="panel-body">
      <div class="calc-bar">
        <input id="calcInput" type="text" placeholder="計算式 (例: 630000*0.02)" autocomplete="off" aria-label="計算式入力" />
        <button id="calcEvalBtn" class="primary-btn" type="button" aria-label="計算を実行">＝</button>
        <div id="calcResult" class="calc-result">0</div>
      </div>
      <div id="calcHistory" class="calc-history"></div>
      <div class="tpl-bar">
        <span>型挿入:</span>
        <button class="tpl-btn" type="button" data-tpl="box">型02 ボックス図</button>
        <button class="tpl-btn" type="button" data-tpl="timeline">型01 タイムライン</button>
        <button class="tpl-btn" type="button" data-tpl="taccount">型03 T勘定</button>
        <button id="clearScratchBtn" class="tpl-btn danger" type="button">クリア</button>
      </div>
      <textarea id="scratchTextarea" class="scratch-textarea" placeholder="ボックス図・タイムライン・途中式を書きながら演習できます（単元別自動保存）..." aria-label="下書きメモ"></textarea>
    </div>
  </section>

  <!-- Cross-device Sync Code Panel -->
  <section id="syncPanel" class="floating-panel wide-panel hidden" aria-label="PC・iPhone 進捗同期コード">
    <div class="panel-header">
      <span>PC・iPhone 進捗同期</span>
      <button class="panel-close" type="button" data-close="syncPanel" aria-label="同期パネルを閉じる">✕</button>
    </div>
    <div class="panel-body">
      <p class="sync-help-text">下の同期コードをコピーして別端末に貼り付けると、チェック・復習日・SRS・暗記ピン留めをそのまま引き継げます。</p>
      <textarea id="syncCodeTextarea" class="scratch-textarea sync-code-textarea" placeholder="BOKI1:... 同期コードをここに貼り付け" aria-label="同期コード"></textarea>
      <div class="tpl-bar sync-actions-bar">
        <button id="copySyncCodeBtn" class="primary-btn" type="button">現在の記録をコピー</button>
        <button id="applySyncCodeBtn" class="secondary-btn" type="button">貼り付けたコードを復元</button>
      </div>
      <div id="syncStatusMsg" class="sync-status-msg"></div>
    </div>
  </section>

  <script src="./curriculum_data.js"></script>
  <script src="./app.js"></script>
  <script src="./studio_tools.js"></script>
</body>
</html>
